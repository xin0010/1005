<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberStore - 頂級遊戲與數位商品商城</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#090d16',
                            card: '#0f172a',
                            border: '#1e293b',
                            cyan: '#06b6d4',
                            cyanHover: '#22d3ee',
                            accent: '#38bdf8',
                            muted: '#94a3b8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        .title-bicolor {
            position: relative;
            display: inline-block;
            background: linear-gradient(90deg, #06b6d4 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .title-bicolor::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #06b6d4 30%, #38bdf8 100%);
            border-radius: 2px;
        }

        .cyber-card {
            background: linear-gradient(135deg, #0f172a 0%, #090d16 100%);
            border: 1px solid rgba(6, 182, 212, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            clip-path: polygon(
                0 0, 
                calc(100% - 15px) 0, 100% 15px, 
                100% 100%, 
                15px 100%, 0 calc(100% - 15px)
            );
        }
        .cyber-card:hover {
            border-color: rgba(6, 182, 212, 0.8);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
            transform: translateY(-3px);
        }

        .cyber-button {
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.1) 0%, rgba(56, 189, 248, 0.2) 100%);
            border: 1px solid rgba(6, 182, 212, 0.4);
            transition: all 0.2s ease;
        }
        .cyber-button:hover {
            background: rgba(6, 182, 212, 0.3);
            border-color: #06b6d4;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-500 selection:text-black">

    <header class="sticky top-0 z-50 bg-[#090d16]/90 backdrop-blur-md border-b border-cyan-900/40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-terminal text-black text-lg"></i>
                </div>
                <span class="font-mono font-bold text-xl tracking-wider text-cyan-400">CYBER<span class="text-white">STORE</span></span>
            </div>
            
            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-300 font-mono">
                <button onclick="switchTab('home')" id="nav-home" class="text-cyan-400 hover:text-cyan-300 transition-colors focus:outline-none cursor-pointer">[首頁]</button>
                <button onclick="switchTab('mobile-store')" id="nav-mobile" class="text-slate-300 hover:text-cyan-300 transition-colors focus:outline-none cursor-pointer">[手遊輔助商城]</button>
            </nav>

            <div class="flex items-center space-x-4">
                <button onclick="toggleCart()" class="relative p-2.5 rounded-lg bg-slate-800/80 border border-slate-700 hover:border-cyan-500 transition-all text-slate-300 hover:text-cyan-400" aria-label="購物車">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-cyan-500 text-black text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center shadow">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col w-full">
        <section id="view-home" class="relative w-full min-h-[85vh] flex flex-col items-center justify-center overflow-hidden py-12">
            <video autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover filter contrast-110 brightness-95 opacity-85 z-0">
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
                您的瀏覽器不支援 HTML5 影片播放。
            </video>
            
            <div class="absolute inset-0 bg-gradient-to-t from-[#090d16] via-[#090d16]/50 to-[#090d16]/80 z-10 pointer-events-none"></div>
            
            <div class="relative z-20 max-w-5xl mx-auto px-4 text-center my-auto">
                <div class="inline-block mb-4 font-mono text-xs text-cyan-400 px-4 py-1.5 rounded-full bg-cyan-950/80 border border-cyan-500/50 backdrop-blur-md shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                    <i class="fa-solid fa-circle text-emerald-400 text-[8px] mr-2 animate-pulse"></i> SYSTEM_CINEMATIC_REEL / 賽博朋克實境串流
                </div>
                <h1 class="text-4xl sm:text-6xl lg:text-7xl font-extrabold font-mono tracking-tight text-white mb-6 drop-shadow-lg">
                    <span class="title-bicolor">AXG SHOP亞洲輔助經銷商</span>
                </h1>
                <p class="text-slate-300 max-w-2xl mx-auto font-mono text-sm sm:text-base mb-10 leading-relaxed">
                    <span class="highlighter-underline text-cyan-100">SECURE DIGITAL ASSETS & PRIVILEGE EXECUTION HUB</span>
                </p>
                <div class="mt-4">
                    <button onclick="switchTab('mobile-store')" class="cyber-button inline-flex items-center gap-2 px-6 py-3 rounded-lg text-cyan-400 font-mono text-sm font-bold transition-transform hover:scale-105 cursor-pointer">
                        <span>進入手遊輔助商城</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <section id="view-mobile-store" class="w-full bg-[#090d16] py-16 px-4 sm:px-6 lg:px-8 hidden">
            <div class="max-w-7xl mx-auto">
                <div class="text-center mb-12">
                    <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-wide mb-2 font-mono">手遊輔助商城</h2>
                    <p class="text-sm font-mono text-slate-400">首頁 / 手遊輔助商城</p>
                </div>

                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <!-- Cards will be populated dynamically -->
                </div>
            </div>
        </section>
    </main>

    <footer class="border-t border-cyan-900/30 bg-[#090d16] py-6 text-center text-xs font-mono text-slate-500">
        <p>&copy; 2026 CYBERSTORE DIGITAL COMMERCE. ALL RIGHTS RESERVED.</p>
    </footer>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-y-0 right-0 z-50 w-full max-w-md bg-[#0f172a] border-l border-cyan-900/50 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-5 border-b border-cyan-900/40 flex items-center justify-between">
            <h3 class="font-mono font-bold text-lg text-white flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping text-cyan-400"></i> 購物車清單 (<span id="cart-count-header">0</span>)
            </h3>
            <button onclick="toggleCart()" class="text-slate-400 hover:text-cyan-400" aria-label="關閉購物車">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-5 space-y-4">
            <p class="text-slate-500 text-center font-mono text-sm py-10">購物車目前無商品</p>
        </div>
        <div class="p-5 border-t border-cyan-900/40 bg-[#090d16]">
            <div class="flex items-center justify-between mb-4">
                <span class="text-sm font-mono text-slate-400">總計金額</span>
                <span id="cart-total" class="text-xl font-bold font-mono text-cyan-400">NT$ 0</span>
            </div>
            <button onclick="checkout()" class="cyber-button w-full py-3.5 rounded-lg font-mono text-sm font-bold text-cyan-400 flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-bolt"></i>
                <span>立即結帳 / CHECKOUT</span>
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-[#0f172a] border border-cyan-500 text-cyan-400 px-5 py-3 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.3)] font-mono text-sm flex items-center gap-3 pointer-events-none">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-msg">操作成功！</span>
    </div>

    <script>
        let cart = [];

        const products = [
            { category: "[特戰英豪]", name: "永久", price: 6500, stock: 99 },
            { category: "[特戰英豪]", name: "月卡", price: 1499, stock: 999 },
            { category: "[特戰英豪]", name: "周卡", price: 600, stock: 999 },
            { category: "[特戰英豪]", name: "天卡", price: 150, stock: 999 },
            { category: "[代理批發]", name: "FREE-FIRE", price: 5500, stock: 100 },
            { category: "[FREE-FIRE]", name: "iOS月卡", price: 1000, stock: 100 },
            { category: "[代理批發]", name: "傳說對決", price: 5500, stock: 500 },
            { category: "[電商網站]", name: "網站設計客製化", price: 20000, stock: 999 },
            { category: "[iOS證書]", name: "保固40天證書", price: 200, stock: 997 },
            { category: "[三角洲行動]", name: "安卓單雷-月卡", price: 1300, stock: 30 },
            { category: "[傳說對決]", name: "ios月卡", price: 1370, stock: 50 },
            { category: "[PUBG]", name: "IOS-月卡", price: 1035, stock: 999 }
        ];

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map((item, idx) => `
                <div class="cyber-card p-5 flex flex-col justify-between h-52">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-mono text-cyan-400">${item.category}</span>
                            <div class="flex items-center gap-1.5 text-xs text-slate-400 font-mono">
                                <i class="fa-solid fa-shield text-emerald-400 text-[10px]"></i>
                                <i class="fa-solid fa-code text-cyan-400 text-[10px]"></i>
                                <i class="fa-solid fa-user-secret text-slate-400 text-[10px]"></i>
                            </div>
                        </div>
                        <h3 class="text-white text-base font-bold font-mono mb-1">${item.name}</h3>
                        <a href="#" onclick="showDetails('${item.category} ${item.name}'); return false;" class="text-[11px] font-mono text-cyan-400/80 hover:text-cyan-300 flex items-center gap-1">
                            <i class="fa-solid fa-folder-open text-[10px]"></i> 查看商品詳情
                        </a>
                    </div>
                    <div>
                        <div class="flex items-baseline justify-between mb-3">
                            <span class="text-cyan-400 font-bold font-mono text-lg">NT$ ${item.price.toLocaleString()}</span>
                            <span class="text-[11px] font-mono text-slate-400">Stock: ${item.stock}</span>
                        </div>
                        <button onclick="addToCart('${item.category} ${item.name}', ${item.price})" class="cyber-button w-full py-2 rounded-lg font-mono text-xs font-bold text-cyan-400 flex items-center justify-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-terminal text-[10px]"></i>
                            <span>EXECUTE / ADD</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tabId) {
            const homeView = document.getElementById('view-home');
            const mobileView = document.getElementById('view-mobile-store');
            const navHome = document.getElementById('nav-home');
            const navMobile = document.getElementById('nav-mobile');

            if (tabId === 'home') {
                homeView.classList.remove('hidden');
                mobileView.classList.add('hidden');
                navHome.className = "text-cyan-400 hover:text-cyan-300 transition-colors focus:outline-none cursor-pointer";
                navMobile.className = "text-slate-300 hover:text-cyan-300 transition-colors focus:outline-none cursor-pointer";
            } else {
                homeView.classList.add('hidden');
                mobileView.classList.remove('hidden');
                navMobile.className = "text-cyan-400 hover:text-cyan-300 transition-colors focus:outline-none cursor-pointer";
                navHome.className = "text-slate-300 hover:text-cyan-300 transition-colors focus:outline-none cursor-pointer";
                renderProducts();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCartUI();
            showToast(`已將 [${name}] 加入購物車`);
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            document.getElementById('cart-badge').innerText = totalCount;
            document.getElementById('cart-count-header').innerText = totalCount;
            document.getElementById('cart-total').innerText = `NT$ ${totalPrice.toLocaleString()}`;

            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-center font-mono text-sm py-10">購物車目前無商品</p>';
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div class="flex items-center justify-between bg-[#090d16] p-3 rounded-xl border border-slate-800">
                    <div>
                        <h4 class="font-mono font-bold text-white text-sm">${item.name}</h4>
                        <span class="text-xs font-mono text-cyan-400">NT$ ${item.price.toLocaleString()} x ${item.qty}</span>
                    </div>
                    <button onclick="removeFromCart(${index})" class="text-slate-500 hover:text-red-400 p-2 cursor-pointer" aria-label="移除商品">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            showToast('已從購物車移除商品');
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('translate-x-full');
        }

        function showDetails(itemName) {
            showToast(`正在讀取 [${itemName}] 詳細規格...`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function checkout() {
            if(cart.length === 0) {
                showToast('購物車內尚無商品！');
                return;
            }
            showToast('已觸發結帳程序！授權金鑰生成中...');
            cart = [];
            updateCartUI();
            toggleCart();
        }

        window.onload = function() {
            renderProducts();
        }
    </script>
</body>
</html>
